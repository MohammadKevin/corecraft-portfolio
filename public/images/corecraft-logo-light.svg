<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="cc-outer-light" x1="378.9" y1="170" x2="378.9" y2="342" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#76C0EC"/>
      <stop offset="1" stop-color="#0284C7"/>
    </linearGradient>
    <radialGradient id="cc-core-light" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#34D399"/>
      <stop offset="1" stop-color="#10B981"/>
    </radialGradient>
  </defs>

  <!-- Transparent background: no rect fill, ready for favicon / light UI -->

  <!-- Group: logo mark, centered at 256,256 -->
  <g fill="none" stroke-linecap="round">
    <!-- Outer C — "Craft" shell, opens right -->
    <path d="M378.9,342 A150,150 0 1 1 378.9,170"
          stroke="url(#cc-outer-light)" stroke-width="30"/>

    <!-- Inner C — "Core" nucleus ring, opens left, nested -->
    <path d="M190.5,210.1 A80,80 0 1 1 190.5,301.9"
          stroke="#4F46E5" stroke-width="22"/>
  </g>

  <!-- Center nucleus diamond -->
  <rect x="242" y="242" width="28" height="28" rx="6"
        transform="rotate(45 256 256)" fill="url(#cc-core-light)"/>

  <!-- Precision accent dot at outer arc tip -->
  <circle cx="404" cy="256" r="11" fill="#1C1B1D"/>
</svg>
