      <stop offset="0%" stop-color="#eaf3ef"/>
      <stop offset="100%" stop-color="#d6e7de"/>
    </linearGradient>
    <radialGradient id="glow-fullstack-4" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#123528" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#123528" stop-opacity="0"/>
