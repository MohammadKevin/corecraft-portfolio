<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="cc-outer-dark" x1="378.9" y1="170" x2="378.9" y2="342" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#76C0EC"/>
      <stop offset="1" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="cc-bg-dark" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#17161A"/>
      <stop offset="1" stop-color="#0D0C0E"/>
    </linearGradient>
    <radialGradient id="cc-core-dark" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#34D399"/>
      <stop offset="1" stop-color="#10B981"/>
    </radialGradient>
  </defs>

  <!-- Squircle container -->
  <rect x="0" y="0" width="512" height="512" rx="132" ry="132" fill="url(#cc-bg-dark)"/>

  <!-- Group: logo mark, centered at 256,256 -->
  <g fill="none" stroke-linecap="round">
    <!-- Outer C — "Craft" shell, opens right -->
    <path d="M378.9,342 A150,150 0 1 1 378.9,170"
          stroke="url(#cc-outer-dark)" stroke-width="30"/>

    <!-- Inner C — "Core" nucleus ring, opens left, nested -->
    <path d="M190.5,210.1 A80,80 0 1 1 190.5,301.9"
          stroke="#6366F1" stroke-width="22"/>
  </g>

  <!-- Center nucleus diamond -->
  <rect x="242" y="242" width="28" height="28" rx="6"
        transform="rotate(45 256 256)" fill="url(#cc-core-dark)"/>

  <!-- Precision accent dot at outer arc tip -->
  <circle cx="404" cy="256" r="11" fill="#FAF8F1"/>
</svg>
